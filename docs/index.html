<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadReady · Εξάσκηση για τη θεωρία διπλώματος</title>
<meta name="description" content="Εξασκήσου για τη θεωρία διπλώματος οδήγησης: αυτοκίνητο, μοτοσικλέτα, φορτηγό, λεωφορείο και ΠΕΙ. Δωρεάν εφαρμογή για Windows.">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0EFEA;
    --paper: #ECEBE5;
    --surface: #FFFFFF;
    --ink: #23262B;
    --ink-soft: #5A5F66;
    --ink-faint: #8B9096;
    --border: #E1DFD8;
    --lane: #F5A623;
    --lane-ink: #6B4700;
    --lane-bg: #FFF3DD;
    --font-head: 'Baloo 2', ui-rounded, 'Segoe UI', sans-serif;
    --font-body: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171A;
      --paper: #1B1E22;
      --surface: #21252A;
      --ink: #F1F1ED;
      --ink-soft: #A7ACB2;
      --ink-faint: #6E7379;
      --border: #33383F;
      --lane: #FFC12E;
      --lane-ink: #3A2900;
      --lane-bg: #3A2E10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171A;
    --paper: #1B1E22;
    --surface: #21252A;
    --ink: #F1F1ED;
    --ink-soft: #A7ACB2;
    --ink-faint: #6E7379;
    --border: #33383F;
    --lane: #FFC12E;
    --lane-ink: #3A2900;
    --lane-bg: #3A2E10;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(color-mix(in srgb, var(--bg) 82%, transparent), color-mix(in srgb, var(--bg) 82%, transparent)),
      url('assets/bg-light.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body {
      background-image:
        linear-gradient(color-mix(in srgb, var(--bg) 60%, transparent), color-mix(in srgb, var(--bg) 60%, transparent)),
        url('assets/bg-dark.jpg');
    }
  }
  :root[data-theme="dark"] body {
    background-image:
      linear-gradient(color-mix(in srgb, var(--bg) 60%, transparent), color-mix(in srgb, var(--bg) 60%, transparent)),
      url('assets/bg-dark.jpg');
  }

  img { max-width: 100%; display: block; }
  a { color: inherit; }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header.site {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 68%, transparent);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  }
  header.site .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 12px;
    padding-bottom: 12px;
    flex-wrap: wrap;
  }
  .brand-logo { height: 36px; width: auto; }
  .brand-logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo-light { display: none; }
    :root:not([data-theme="light"]) .brand-logo-dark { display: block; }
  }
  :root[data-theme="dark"] .brand-logo-light { display: none; }
  :root[data-theme="dark"] .brand-logo-dark { display: block; }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .segmented {
    display: flex;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .segment {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 6px 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .segment svg { width: 14px; height: 14px; }
  .segment.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .hero {
    padding: 24px 0 4px;
    text-align: center;
  }
  .hero h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(24px, 4vw, 34px);
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .hero p.lead {
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 560px;
    margin: 0 auto 26px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    border-radius: 14px;
    padding: 13px 26px;
    margin: 6px 0;
    background: var(--lane);
    color: var(--lane-ink);
    box-shadow: 0 10px 30px rgba(245, 166, 35, 0.35);
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 2px var(--lane);
    margin-left: 8px;
  }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .hero-sub {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .hero-sub a { text-decoration: underline; }

  /* Animated road strip, matching the app's own hero animation: full-bleed
     across the viewport, like the app's own hero-road. */
  .hero-road {
    position: relative;
    left: 50%;
    width: 100vw;
    margin: 30px 0 10px -50vw;
    height: 6px;
    background: var(--border);
    overflow: visible;
  }
  .hero-road::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, var(--lane) 0px, var(--lane) 22px, transparent 22px, transparent 40px);
  }
  .hero-road img {
    position: absolute;
    bottom: -1px;
    transform: translateX(-50%);
  }
  .hero-bus { width: 62px; height: auto; animation: drive-bus 22s linear infinite; animation-delay: -3s; }
  .hero-car { width: 50px; height: auto; animation: drive-car 18s linear infinite; }
  .hero-bike { width: 40px; height: auto; animation: drive-bike 14s linear infinite; animation-delay: -6s; }
  .hero-moto { width: 42px; height: auto; animation: drive-moto 16s linear infinite; animation-delay: -9s; }
  @keyframes drive-bus { from { left: -10%; } to { left: 110%; } }
  @keyframes drive-car { from { left: -8%; } to { left: 108%; } }
  @keyframes drive-bike { from { left: -6%; } to { left: 106%; } }
  @keyframes drive-moto { from { left: -7%; } to { left: 107%; } }

  section.features {
    padding: 24px 0 8px;
  }
  section.features h2 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 20px;
    text-align: center;
    margin: 0 0 14px;
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .feature-card {
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .feature-card .icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--lane-bg);
    color: var(--lane);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .feature-card .icon svg { width: 17px; height: 17px; }
  .feature-card h3 {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 14px;
    margin: 0 0 4px;
  }
  .feature-card p {
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
    margin: 0;
  }

  footer.site {
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--paper) 75%, transparent);
    padding: 14px 0 18px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
  }
  footer.site a { text-decoration: underline; }

  @media (max-width: 640px) {
    .feature-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .feature-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <img class="brand-logo brand-logo-light" src="assets/logo-light.png" alt="RoadReady">
    <img class="brand-logo brand-logo-dark" src="assets/logo-dark.png" alt="RoadReady">
    <div class="header-controls">
      <div class="segmented" id="langToggle">
        <button class="segment" data-lang="el" type="button">ΕΛ</button>
        <button class="segment" data-lang="en" type="button">EN</button>
      </div>
      <div class="segmented" id="themeToggle">
        <button class="segment" data-theme="system" type="button" aria-label="System theme">
          <svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 14H10.5M8 11.5V14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="segment" data-theme="light" type="button" aria-label="Light theme">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5V3M8 13V14.5M14.5 8H13M3 8H1.5M12.4 3.6L11.3 4.7M4.7 11.3L3.6 12.4M12.4 12.4L11.3 11.3M4.7 4.7L3.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="segment" data-theme="dark" type="button" aria-label="Dark theme">
          <svg viewBox="0 0 16 16" fill="none"><path d="M13.5 9.5C12.6 10 11.6 10.2 10.6 10C8 9.5 6.2 7.1 6.5 4.5C6.6 3.5 7 2.6 7.5 1.9C4.4 2.5 2 5.2 2 8.5C2 12.1 4.9 15 8.5 15C11.3 15 13.7 13.2 14.5 10.6C14.2 10.1 13.9 9.8 13.5 9.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <h1 data-i18n="heroTitle"></h1>
    <p class="lead" data-i18n="heroLead"></p>

    <a class="btn" href="https://github.com/VaratisG/RoadReady/releases/latest/download/RoadReadySetup.exe">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3V15M12 15L7 10M12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="downloadBtn"></span>
    </a>
    <a class="btn btn-secondary" href="app/">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M3 12H21M12 3C14.5 5.7 15.8 8.7 15.8 12C15.8 15.3 14.5 18.3 12 21C9.5 18.3 8.2 15.3 8.2 12C8.2 8.7 9.5 5.7 12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span data-i18n="browserBtn"></span>
    </a>
    <p class="hero-sub">
      Windows 10/11 ·
      <a href="https://github.com/VaratisG/RoadReady" data-i18n="sourceLink"></a>
    </p>

    <div class="hero-road" aria-hidden="true">
      <img class="hero-bus" src="assets/vehicles/bus.png" alt="">
      <img class="hero-car" src="assets/vehicles/car.png" alt="">
      <img class="hero-bike" src="assets/vehicles/bicycle.png" alt="">
      <img class="hero-moto" src="assets/vehicles/motorbike.png" alt="">
    </div>
  </section>

  <section class="features wrap">
    <h2 data-i18n="featuresTitle"></h2>
    <div class="feature-grid">
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 3V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 4H14L11.5 7L14 10H5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <h3 data-i18n="feat1Title"></h3>
        <p data-i18n="feat1Desc"></p>
      </div>
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 13.5V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 13.5V4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11.5 13.5V6.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h3 data-i18n="feat2Title"></h3>
        <p data-i18n="feat2Desc"></p>
      </div>
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 22 22" fill="none"><path d="M11 3L20 18H2L11 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 9V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h3 data-i18n="feat3Title"></h3>
        <p data-i18n="feat3Desc"></p>
      </div>
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M4 2.5H12C12.5 2.5 13 3 13 3.5V14L8 11.5L3 14V3.5C3 3 3.5 2.5 4 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
        <h3 data-i18n="feat4Title"></h3>
        <p data-i18n="feat4Desc"></p>
      </div>
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5V3M8 13V14.5M14.5 8H13M3 8H1.5M12.4 3.6L11.3 4.7M4.7 11.3L3.6 12.4M12.4 12.4L11.3 11.3M4.7 4.7L3.6 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <h3 data-i18n="feat5Title"></h3>
        <p data-i18n="feat5Desc"></p>
      </div>
      <div class="feature-card">
        <div class="icon">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 12.5L6 4.5H10L13.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.2 9.5H11.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <h3 data-i18n="feat6Title"></h3>
        <p data-i18n="feat6Desc"></p>
      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <p>
      RoadReady · <a href="https://github.com/VaratisG/RoadReady" data-i18n="footerSource"></a>.
      <span data-i18n="footerNote"></span>
    </p>
    <p>Developed by George Varatis</p>
  </div>
</footer>

<script>
(function () {
  var LANG_KEY = 'roadready-landing-lang';
  var THEME_KEY = 'roadready-landing-theme';

  var translations = {
    el: {
      pageTitle: 'RoadReady · Εξάσκηση για τη θεωρία διπλώματος',
      heroTitle: 'Εξασκήσου για τη θεωρία<br>του διπλώματος οδήγησης',
      heroLead: 'Αυτοκίνητο, μοτοσικλέτα, φορτηγό, λεωφορείο και ΠΕΙ φορτηγό. Πάνω από 1.800 πραγματικές ερωτήσεις θεωρίας, με προσομοίωση εξέτασης και παρακολούθηση της προόδου σου.',
      downloadBtn: 'Λήψη για Windows',
      browserBtn: 'Χρήση από τον browser',
      sourceLink: 'Πηγαίος κώδικας στο GitHub',
      featuresTitle: 'Τι περιλαμβάνει',
      feat1Title: 'Προσομοίωση εξέτασης',
      feat1Desc: 'Επίλεξε αριθμό ερωτήσεων, ενεργοποίησε χρονόμετρο (ανά εξέταση ή ανά ερώτηση) και δες πλήρη ανασκόπηση στο τέλος.',
      feat2Title: 'Παρακολούθηση προόδου',
      feat2Desc: 'Κάθε τεστ αποθηκεύεται στον λογαριασμό σου: μέσος όρος, ανάλυση ανά κατηγορία και ιστορικό, συγχρονισμένα σε κάθε συσκευή.',
      feat3Title: 'Εξάσκηση σε λάθη',
      feat3Desc: 'Μόλις συγκεντρώσεις 5+ λάθη σε μια κατηγορία, ξεκλειδώνεται εξάσκηση αποκλειστικά πάνω σε αυτά, μέχρι να τα μάθεις.',
      feat4Title: 'Αποθηκευμένες ερωτήσεις',
      feat4Desc: 'Σημείωσε οποιαδήποτε ερώτηση κατά τη διάρκεια ενός τεστ και ξαναδές τη αργότερα από τη λίστα αποθηκευμένων.',
      feat5Title: 'Φωτεινό / σκοτεινό θέμα',
      feat5Desc: 'Ακολουθεί αυτόματα το θέμα των Windows, ή διάλεξε το χειροκίνητα, μαζί με ρυθμιζόμενο μέγεθος κειμένου.',
      feat6Title: 'Αυτόματες ενημερώσεις',
      feat6Desc: 'Η εφαρμογή σε ειδοποιεί μόνη της όταν βγαίνει νέα έκδοση. Ένα κλικ και ενημερώνεται.',
      footerSource: 'πηγαίος κώδικας στο GitHub',
      footerNote: 'Χρειάζεται σύνδεση στο διαδίκτυο για είσοδο και συγχρονισμό προόδου.'
    },
    en: {
      pageTitle: 'RoadReady · Practice for your driving theory test',
      heroTitle: 'Practice for your<br>driving theory test',
      heroLead: 'Car, motorcycle, truck, bus, and professional truck-driver certificate. Over 1,800 real theory questions, with exam simulation and progress tracking.',
      downloadBtn: 'Download for Windows',
      browserBtn: 'Use in your browser',
      sourceLink: 'Source code on GitHub',
      featuresTitle: "What's included",
      feat1Title: 'Exam simulation',
      feat1Desc: 'Choose the question count, enable a timer (per exam or per question), and get a full review at the end.',
      feat2Title: 'Progress tracking',
      feat2Desc: 'Every test is saved to your account: overall average, per-category breakdown, and history, synced across devices.',
      feat3Title: 'Mistakes practice',
      feat3Desc: 'Once you’ve missed 5+ questions in a category, a practice mode unlocks that quizzes you on exactly those until you get them right.',
      feat4Title: 'Saved questions',
      feat4Desc: 'Flag any question during a test and revisit it later from your saved-questions list.',
      feat5Title: 'Light / dark theme',
      feat5Desc: 'Follows your Windows theme automatically, or pick it manually, plus adjustable text size.',
      feat6Title: 'Automatic updates',
      feat6Desc: 'The app checks for new versions itself and updates with one click.',
      footerSource: 'source code on GitHub',
      footerNote: 'Requires an internet connection to sign in and sync progress.'
    }
  };

  function detectDefaultLang() {
    try {
      var nav = (navigator.language || '').toLowerCase();
      if (nav.indexOf('el') === 0) return 'el';
    } catch (e) {}
    return 'en';
  }

  function applyLang(lang) {
    var dict = translations[lang] || translations.el;
    document.documentElement.setAttribute('lang', lang);
    document.title = dict.pageTitle;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('#langToggle .segment').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  }

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    document.querySelectorAll('#themeToggle .segment').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  document.getElementById('langToggle').addEventListener('click', function (e) {
    var btn = e.target.closest('.segment');
    if (btn) applyLang(btn.getAttribute('data-lang'));
  });
  document.getElementById('themeToggle').addEventListener('click', function (e) {
    var btn = e.target.closest('.segment');
    if (btn) applyTheme(btn.getAttribute('data-theme'));
  });

  var savedLang = null;
  var savedTheme = null;
  try {
    savedLang = localStorage.getItem(LANG_KEY);
    savedTheme = localStorage.getItem(THEME_KEY);
  } catch (e) {}

  applyLang(savedLang || detectDefaultLang());
  applyTheme(savedTheme || 'system');
})();
</script>

</body>
</html>
